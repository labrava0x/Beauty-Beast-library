<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Bibliothèque Enchantée: Belle's Literary Enchanted Journey</title>
    <link rel="stylesheet" href="bellestyle.css">
</head>
<body>

    <!-- 🚪 The Enchanted Threshold Portal -->
    <div id="threshold-portal" class="threshold-portal">
        <div class="portal-content">
            <h1 class="portal-title">I want adventure in the great wide somewhere!</h1>
            <p class="portal-subtitle"> "I can't believe it! I have never seen so many books in my life."</p>
            <div class="portal-sigil">🌹</div>
        </div>
    </div>

    <!-- 🏰 Main Entrance Header -->
    <header class="enchanted-header">
        <div class="header-inner">
            <span class="enchanted-badge">v1-belle-enchanted-library</span>
            <h1 style="color: #ff0054 !important; font-family: 'Cinzel', serif; font-size: 2.8rem; margin-bottom: 0.5rem; text-shadow: 0 0 15px rgba(255, 0, 84, 0.6), 0 2px 10px rgba(0,0,0,0.7);">La Bibliothèque Enchantée</h1>
            <p class="enchanted-tagline" style="color: #ff4d6d !important; font-size: 1.2rem; font-style: italic; max-width: 650px; margin: 0 auto; text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);">Where through shared readings, and an enchanted rose, a fairy tale love bloomed!</p>
            
            <!-- 🖋️ Scribe & Export Action Buttons -->
            <div class="header-actions" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <button id="open-scribe-btn" class="scribe-trigger-btn">🌹 Inscribe a New Volume</button>
                <button id="export-library-btn" class="scribe-trigger-btn export-btn">📜 Export Belle's Archives</button>
            </div>
        </div>
    </header>

    <!-- 📜 Add Volume Modal / Form Overlay -->
    <div id="scribe-modal" class="scribe-modal-overlay" style="display: none;">
        <div class="scribe-modal-content">
            <h2 class="scribe-modal-title">Inscribe to Belle's Archives</h2>
            <form id="add-volume-form">
                <div class="form-group">
                    <label for="book-title">Volume Title</label>
                    <input type="text" id="book-title" required placeholder="e.g., The Tales of Ancient France">
                </div>
                <div class="form-group">
                    <label for="book-author">Author / Scribe</label>
                    <input type="text" id="book-author" required placeholder="e.g., Charles Perrault">
                </div>
                <div class="form-group">
                    <label for="book-shelf">Enchanted Wing / Shelf</label>
                    <select id="book-shelf" required>
                        <option value="French Fairy Tales">French Fairy Tales & Folklore</option>
                        <option value="High Fantasy">High Fantasy & Epic Quests</option>
                        <option value="Plot Twists">Famous Plot Twists & Deceptions</option>
                        <option value="Philosophical Tomes">Philosophical Tomes</option>
                        <option value="Teaching the Prince to Read">Teaching the Prince to Read</option>
                        <option value="Shared While Cursed">Shared While Cursed</option>
                        <option value="Shared After the Spell">Shared After the Spell</option>
                        <option value="Read After Marriage">Read After Marriage</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="book-status">Reading State</label>
                    <select id="book-status" required>
                        <option value="powerfully-read">✨ Powerfully Read</option>
                        <option value="powerfully-reading">📖 Powerfully Reading</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="book-notes">Manuscript Notes & Marginalia</label>
                    <textarea id="book-notes" rows="3" placeholder="Write personal marginalia or impressions..."></textarea>
                </div>
                <div class="scribe-modal-actions">
                    <button type="submit" class="submit-scribe-btn">Seal in Archives</button>
                    <button type="button" id="close-scribe-btn" class="cancel-scribe-btn">Return</button>
                </div>
            </form>
        </div>
    </div>

    <main class="enchanted-main">
        <!-- Dynamic Book Grid Populated by bellelibrary.js -->
        <div id="library" class="book-grid"></div>
    </main>

    <!-- Core Script -->
    <script src="bellelibrary.js"></script>
</body>
</html>
